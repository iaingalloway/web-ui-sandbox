<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsing border</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #08060e;
        --panel: #100a1b;
        --trace: #592653;
        --energy: #ff4dce;
        --hot: #ffe4f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--background);
        display: grid;
        font-family: "Space Mono", "Courier New", monospace;
        padding: 2rem;
        margin: 0;
        min-height: 100vh;
      }

      main {
        margin: auto;
        max-width: 58rem;
        width: 100%;
      }

      h1 {
        color: #f7d9ed;
        font-size: 2.4rem;
        font-weight: 400;
      }

      h2 {
        color: var(--energy);
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      p {
        color: #d5bdd0;
        line-height: 1.6;
        margin: 0;
      }

      .frame {
        --angle: 0deg;
        --border-width: 2px;
        background: var(--panel);
        border: var(--border-width) solid var(--trace);
        min-height: 18rem;
        padding: 3rem;
        position: relative;
      }

      .border-bloom {
        animation: circuit 10s linear infinite;
        border: var(--border-width) solid transparent;
        border-image: conic-gradient(
            from var(--angle),
            transparent 0deg 292deg,
            var(--energy) 310deg 326deg,
            var(--hot) 330deg,
            var(--energy) 334deg 350deg,
            transparent 360deg
          )
          1;
        filter: drop-shadow(0 0 6px var(--energy))
          drop-shadow(0 0 14px var(--energy));
        inset: calc(-1 * var(--border-width));
        pointer-events: none;
        position: absolute;
        z-index: 1;
      }

      .content {
        border-left: 2px solid var(--energy);
        max-width: 32rem;
        padding-left: 1rem;
      }

      @property --angle {
        inherits: false;
        initial-value: 0deg;
        syntax: "<angle>";
      }

      @keyframes circuit {
        to {
          --angle: 360deg;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pulsing border</h1>
      <section
        class="frame"
        aria-label="Animated cyberpunk border demonstration"
      >
        <span class="border-bloom" aria-hidden="true"></span>
        <div class="content">
          <h2>System Active</h2>
          <p>The energy pulses around the circuit.</p>
        </div>
      </section>
    </main>
  </body>
</html>
